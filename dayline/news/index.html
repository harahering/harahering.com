<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>お知らせ - Day Line</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
  <!-- 公開準備中の表示。アプリの公開時に、この div と下の robots の meta を消す -->
  <div class="prerelease">このサイトは公開準備中です。Day Line は App Store で近日公開予定です。</div>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/dayline/"><img src="/assets/dayline-icon.png" alt="">Day Line</a>
      <nav class="site-nav">
        <a href="/dayline/news/" aria-current="page">お知らせ</a>
        <a href="/dayline/help/">ヘルプ</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>お知らせ</h1>
    <p class="lead">アップデートの内容や、不具合とその対応をお知らせします。アプリの設定の「お知らせ」でも読めます。</p>
    <div id="news-list">
      <p class="news-empty">読み込んでいます…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <nav>
        <a href="/dayline/news/">お知らせ</a>
        <a href="/dayline/help/">ヘルプ</a>
        <a href="/dayline/terms/">利用規約</a>
        <a href="/dayline/privacy/">プライバシーポリシー</a>
        <!-- 問い合わせフォームの URL が決まったら差し替える -->
        <span>お問い合わせ(準備中)</span>
      </nav>
      <p>&copy; 2026 harahering</p>
    </div>
  </footer>
  <script src="/assets/news.js"></script>
</body>
</html>
